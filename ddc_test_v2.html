<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDC Test</title>
</head>

<body>

<h2>DDC Test</h2>

<div id="status">Waiting...</div>

<img id="logo" style="max-width:300px; height:auto;" />

<script>
    
window.addEventListener("message", function(e) {

    console.log("RAW:", e.data);

    const payload = e.data?.data || e.data;

    // ✅ handle array correctly
    const row = Array.isArray(payload) ? payload[0] : payload;

    console.log("ROW:", row);

    const url = row?.logoURL;

    console.log("logoURL:", url);

    const img = document.getElementById("logo");

    if (url) {
        img.src = url;
    } else {
        img.removeAttribute("src");
    }

});
    
</script>

</body>
</html>
