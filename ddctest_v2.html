<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Team Logo Viewer</title>
</head>

<body style="font-family:Anova, Arial, sans-serif; text-align:center; margin-top:20px;">

<div id="playerName"
     style="font-size:22px; font-weight:bold; margin-bottom:15px;">
</div>
    
<div id="teamName"
     style="font-size:22px; font-weight:bold; margin-bottom:15px;">
</div>

<img id ="flag"
    style="max-width:45px; max-height:30px; object-fit:contain;" />
    
<img id="logo"
     style="max-width:300px; max-height:300px; object-fit:contain;" />

<script>

window.addEventListener("message", function(e) {

    console.log(e.data);

    const img = document.getElementById("logo");
    const flag = document.getElementById("flag");
    const teamName = document.getElementById("teamName");
    const playerName = document.getElementById("playerName");

    if (!e.data || !e.data.data || e.data.rowCount === 0) {
        img.removeAttribute("src");
        flag.removeAttribute("src");
        teamName.textContent = "";
        playerName.textContent = "";
        return;
    }

    // Find the column positions by label
    const teamIndex = e.data.columns.findIndex(c => c.label === "Team");
    const logoIndex = e.data.columns.findIndex(c => c.label === "logoURL");
    const playerIndex = e.data.columns.findIndex(c => c.label === "Player");
    const flagIndex = e.data.columns.findIndex(c => c.label === "flagURL");

    const team = e.data.data[0][teamIndex];
    const logoURL = e.data.data[0][logoIndex];
    const cFlag = e.data.data[0][flagIndex];
    const player = e.data.data[0][playerIndex];

    playerName.textContent = "Name: " + player; flagsrc =cFlag;
    teamName.textContent = "Team: " + team;

    img.src = logoURL;

});

</script>

</body>
</html>
