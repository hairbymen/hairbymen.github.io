<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add-to-Calendar Link Generator</title><style>body{font:16px Segoe UI,system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:860px;margin:auto;padding:36px 18px}.card{background:#fff;border:1px solid #d9dfeb;border-radius:16px;padding:22px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.field{display:grid;gap:6px}input,textarea,select,button,a{font:inherit}input,textarea,select{padding:11px;border:1px solid #d9dfeb;border-radius:9px}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}button,a.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer}.primary,.open{background:#2563eb;color:#fff}.secondary,.copy{background:#eef2f8;color:#24324a}#results{display:none}#results.show{display:block}.provider{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;border:1px solid #d9dfeb;border-radius:10px;padding:12px;margin:10px 0}.muted{color:#667085}.success{color:#067647}.error{color:#b42318}.preview{white-space:pre-wrap;word-break:break-all;font:12px monospace;background:#f8fafc;padding:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.provider{grid-template-columns:1fr 1fr}.provider>div{grid-column:1/-1}}</style></head><body><main class="wrap"><h1>Add-to-Calendar Link Generator</h1><p class="muted">Create Google, Microsoft 365, Outlook.com, Yahoo, and ICS calendar entries.</p><section class="card"><form id="form"><div class="grid"><label class="field full">Event title<input id="title" required></label><label class="field full">Location / Meeting Link<input id="location" placeholder="Physical location or virtual meeting URL"></label><label class="field full">Description<textarea id="description"></textarea></label><label class="field full">Timezone<select id="timezone"></select></label><label class="full"><input id="allDay" type="checkbox"> All-day event</label><label class="field">Start date<input id="startDate" type="date" required></label><label class="field timed">Start time<input id="startTime" type="time" required></label><label class="field">End date<input id="endDate" type="date" required></label><label class="field timed">End time<input id="endTime" type="time" required></label></div><div class="actions"><button class="primary" type="submit">Generate calendar links</button><button class="secondary" type="reset">Clear</button><strong id="status"></strong></div></form></section><section id="results" class="card"><h2>Calendar links</h2><div id="providers"></div><details><summary>Show generated URLs</summary><div id="preview" class="preview"></div></details></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),form=$('form'),tz=$('timezone'),allDay=$('allDay'),sd=$('startDate'),st=$('startTime'),ed=$('endDate'),et=$('endTime'),results=$('results'),providers=$('providers'),preview=$('preview'),status=$('status');const fallback=['UTC','America/St_Johns','America/Halifax','America/Toronto','America/Winnipeg','America/Regina','America/Edmonton','America/Vancouver','America/Los_Angeles','America/Denver','America/Chicago','America/New_York','Europe/London','Europe/Paris','Europe/Berlin','Asia/Dubai','Asia/Kolkata','Asia/Singapore','Asia/Tokyo','Australia/Sydney','Pacific/Auckland'];const pad=n=>String(n).padStart(2,'0'),dateValue=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),enc=v=>encodeURIComponent(v||''),compactDate=s=>s.replace(/-/g,''),compactUtc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');function offset(zone){try{let x=(new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'shortOffset'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName')||{}).value||'GMT';if(x==='GMT')return'GMT+00:00';let m=x.match(/^GMT([+-])(\d{1,2})(?::?(\d{2}))?$/);return m?'GMT'+m[1]+pad(m[2])+':'+pad(m[3]||0):x}catch{return'GMT'}}function loadZones(){let list=fallback;try{if(Intl.supportedValuesOf)list=Intl.supportedValuesOf('timeZone')}catch{}let detected=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';if(!list.includes(detected))list=[detected,...list];list.forEach(z=>{let o=document.createElement('option');o.value=z;o.textContent='('+offset(z)+') '+z.replace(/_/g,' ');o.selected=z===detected;tz.appendChild(o)})}function defaults(){let d=new Date();d.setSeconds(0,0);d.setMinutes(Math.ceil(d.getMinutes()/30)*30);sd.value=dateValue(d);st.value=pad(d.getHours())+':'+pad(d.getMinutes());d.setHours(d.getHours()+1);ed.value=dateValue(d);et.value=pad(d.getHours())+':'+pad(d.getMinutes());allDay.checked=false;toggle()}function toggle(){document.querySelectorAll('.timed').forEach(x=>x.hidden=allDay.checked);st.required=et.required=!allDay.checked}function addDay(s){let p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+1)).toISOString().slice(0,10)}function toUtc(date,time,zone){let p=date.split('-').map(Number),q=time.split(':').map(Number),g=Date.UTC(p[0],p[1]-1,p[2],q[0],q[1]),fmt=new Intl.DateTimeFormat('en-CA',{timeZone:zone,hour12:false,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});for(let i=0;i<3;i++){let a={};fmt.formatToParts(new Date(g)).forEach(x=>{if(x.type!=='literal')a[x.type]=Number(x.value)});if(a.hour===24)a.hour=0;g+=Date.UTC(p[0],p[1]-1,p[2],q[0],q[1])-Date.UTC(a.year,a.month-1,a.day,a.hour,a.minute,a.second||0)}return new Date(g)}function eventData(){let e={title:$('title').value.trim(),location:$('location').value.trim(),desc:$('description').value,zone:tz.value,all:allDay.checked,sd:sd.value,st:st.value,ed:ed.value,et:et.value};if(!e.title||!e.sd||!e.ed||(!e.all&&(!e.st||!e.et)))throw Error('Complete the title, date, and time fields.');if(e.ed<e.sd)throw Error('End date cannot be before start date.');e.isUrl=/^https?:\/\//i.test(e.location);e.details=[e.desc,e.isUrl?'Meeting Link:\n'+e.location:''].filter(Boolean).join('\n\n');e.outlookBody=e.details.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r\n|\r|\n/g,'<br>');if(!e.all){e.su=toUtc(e.sd,e.st,e.zone);e.eu=toUtc(e.ed,e.et,e.zone);if(e.eu<=e.su)throw Error('End time must be after start time.')}return e}function makeLinks(e){let dates,os,oe,ys,dur;if(e.all){let ex=addDay(e.ed);dates=compactDate(e.sd)+'/'+compactDate(ex);os=e.sd+'T00:00:00';oe=ex+'T00:00:00';ys=compactDate(e.sd);dur=pad(Math.round((Date.parse(ex)-Date.parse(e.sd))/3600000))+'00'}else{dates=compactUtc(e.su)+'/'+compactUtc(e.eu);os=e.su.toISOString();oe=e.eu.toISOString();ys=compactUtc(e.su);let m=Math.round((e.eu-e.su)/60000);dur=pad(Math.floor(m/60))+pad(m%60)}let outlook=base=>base+'?path=/calendar/action/compose&rru=addevent&subject='+enc(e.title)+'&body='+enc(e.outlookBody)+'&location='+enc(e.location)+'&startdt='+enc(os)+'&enddt='+enc(oe)+'&allday='+(e.all?'true':'false');return{Google:'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+enc(e.title)+'&details='+enc(e.details)+'&location='+enc(e.location)+'&ctz='+enc(e.zone)+'&dates='+dates,'Microsoft 365':outlook('https://outlook.office.com/calendar/0/deeplink/compose'),'Outlook.com':outlook('https://outlook.live.com/calendar/0/deeplink/compose'),Yahoo:'https://calendar.yahoo.com/?v=60&view=d&type=20&title='+enc(e.title)+'&st='+ys+'&dur='+dur+'&desc='+enc(e.details)+'&in_loc='+enc(e.location)}}function escapeIcs(v){return(v||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}function makeIcs(e){let a=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Calendar Link Generator//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+Date.now()+'@calendar-link-generator','DTSTAMP:'+compactUtc(new Date())];if(e.all)a.push('DTSTART;VALUE=DATE:'+compactDate(e.sd),'DTEND;VALUE=DATE:'+compactDate(addDay(e.ed)));else a.push('DTSTART;TZID='+e.zone+':'+compactDate(e.sd)+'T'+e.st.replace(':','')+'00','DTEND;TZID='+e.zone+':'+compactDate(e.ed)+'T'+e.et.replace(':','')+'00');a.push('SUMMARY:'+escapeIcs(e.title));if(e.details)a.push('DESCRIPTION:'+escapeIcs(e.details));if(e.location)a.push('LOCATION:'+escapeIcs(e.location));if(e.isUrl)a.push('URL:'+escapeIcs(e.location));a.push('END:VEVENT','END:VCALENDAR');return a.join('\r\n')+'\r\n'}function copy(text,b){let done=()=>{let old=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=old,1200)};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done);else{let x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();done()}}function download(text,title){let u=URL.createObjectURL(new Blob([text],{type:'text/calendar'})),a=document.createElement('a');a.href=u;a.download=(title.replace(/[^a-z0-9]+/gi,'-')||'event')+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function render(ls,cal,e){providers.innerHTML='';Object.keys(ls).forEach(n=>{let r=document.createElement('div');r.className='provider';r.innerHTML='<div><strong>'+n+'</strong><div class="muted">Open a pre-filled event</div></div>';let a=document.createElement('a');a.className='btn open';a.href=ls[n];a.target='_blank';a.rel='noopener';a.textContent='Open';let c=document.createElement('button');c.className='copy';c.type='button';c.textContent='Copy link';c.onclick=()=>copy(ls[n],c);r.append(a,c);providers.appendChild(r)});let r=document.createElement('div');r.className='provider';r.innerHTML='<div><strong>ICS file</strong><div class="muted">Universal calendar file</div></div>';let d=document.createElement('button');d.className='open';d.type='button';d.textContent='Download';d.onclick=()=>download(cal,e.title);let c=document.createElement('button');c.className='copy';c.type='button';c.textContent='Copy ICS';c.onclick=()=>copy(cal,c);r.append(d,c);providers.appendChild(r);preview.textContent=Object.keys(ls).map(k=>k+':\n'+ls[k]).join('\n\n');results.classList.add('show')}form.addEventListener('submit',ev=>{ev.preventDefault();try{let e=eventData();render(makeLinks(e),makeIcs(e),e);status.textContent='Calendar links generated successfully.';status.className='success'}catch(x){results.classList.remove('show');status.textContent=x.message;status.className='error'}});form.addEventListener('reset',()=>setTimeout(()=>{defaults();results.classList.remove('show');status.textContent=''},0));allDay.addEventListener('change',toggle);st.addEventListener('change',()=>{if(sd.value&&st.value){let d=new Date(sd.value+'T'+st.value);d.setHours(d.getHours()+1);ed.value=dateValue(d);et.value=pad(d.getHours())+':'+pad(d.getMinutes())}});loadZones();defaults()})();
</script></body></html>
