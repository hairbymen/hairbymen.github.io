<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Player Flag Viewer</title>
</head>

<img id ="flag"
    style="max-width:90px; max-height:60px; object-fit:contain;" />
  
<script>

window.addEventListener("message", function(e) {

    console.log(e.data);

    const flag = document.getElementById("flag");

    if (!e.data || !e.data.data || e.data.rowCount === 0) {
        flag.removeAttribute("src");
        return;
    }

    // Find the column positions by label

    const flagIndex = e.data.columns.findIndex(c => c.label === "flagURL");
    const cFlag = e.data.data[0][flagIndex];
    flag.src =cFlag;
  
});

</script>
</body>
</html>
