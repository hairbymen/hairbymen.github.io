<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDC Test</title>
</head>

<body>

<h2>DDC Test</h2>

<div id="status">Waiting...</div>

<img id="logo" style="max-width:300px; height:auto;" />

<script>
    
window.addEventListener("message", function(e) {

    const payload = e.data?.data || e.data;

    const row = Array.isArray(payload) ? payload[0] : payload;

    const url = row?.logoURL;

    const img = document.getElementById("logo");

    if (url && img.src !== url) {
        img.src = url;
    }

});
    
</script>

</body>
</html>
