<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDC Test</title>
</head>

<body>

<h2>DDC Test</h2>

<div id="status">Waiting...</div>

<img id="logo" style="max-width:300px; height:auto;" />

<script>
    
window.addEventListener("message", function(e) {

    console.log("RAW:", e.data);

    const payload = e.data?.data ?? e.data;

    const url = typeof payload === "string" ? payload : payload?.logoURL;

    console.log("IMAGE URL:", url);

    const img = document.getElementById("logo");

    if (url) {
        img.src = url;
    } else {
        img.removeAttribute("src");
    }

});
    
</script>

</body>
</html>
