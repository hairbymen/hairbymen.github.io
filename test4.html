<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DDC Test</title>
</head>

<body>

<h2>DDC Test</h2>

<div id="status">Waiting...</div>

<script>

window.addEventListener("message", function(e) {

    const payload =
        e.data?.data?.data ||
        e.data?.data ||
        e.data;

    console.log("PAYLOAD:", payload);

    const img = document.getElementById("logo");

    const url = payload?.logoURL;

    console.log("logoURL =", url);

    if (!url) {
        console.warn("No logoURL found in payload");
        return;
    }

    // Force refresh (important in some browsers/DDC cases)
    img.src = "";
    setTimeout(() => {
        img.src = url;
    }, 10);

});

</script>

</body>
</html>
